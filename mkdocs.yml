# MkDocs config — auto-generated from translated docs
site_name: Документация Hermes Agent
site_description: Полный перевод документации Hermes Agent на русский язык
site_url: https://perejaslav.github.io/hermes-docs-ru/
repo_url: https://github.com/perejaslav/hermes-docs-ru
edit_uri: blob/main/translated/
docs_dir: site_source

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Переключить на тёмную тему
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Переключить на светлую тему
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  icon:
    logo: material/book-open-variant
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/perejaslav/hermes-docs-ru
    - icon: fontawesome/brands/discord
      link: https://discord.gg/NousResearch
  generator: false

copyright: Copyright &copy; 2025-2026 Nous Research — перевод сообщества

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true
      title: На этой странице
  - attr_list
  - md_in_html

